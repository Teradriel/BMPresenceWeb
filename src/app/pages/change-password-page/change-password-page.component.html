<div class="mx-auto flex w-full max-w-[480px] flex-col gap-4 px-3 py-4 md:py-8">
  <form class="w-full rounded-[14px] border border-line bg-surface p-7 flex flex-col gap-5" (ngSubmit)="onChangePassword()" novalidate>
    <div>
      <h2 class="text-2xl font-semibold tracking-tight">Cambia password</h2>
      <p class="mt-1.5 text-sm text-muted">Inserisci la password attuale e la nuova.</p>
    </div>
    @if (isForced) {
      <div class="rounded-[10px] bg-warn-soft px-3.5 py-3 text-[13px] text-warn-ink">Devi cambiare la tua password. Inserisci la password temporanea fornita dall'amministratore.</div>
    }
    @if (errorMessage) {
      <div class="rounded-[10px] bg-err-soft px-3.5 py-3 text-[13px] text-err-ink" role="alert">{{ errorMessage }}</div>
    }
    <label class="flex flex-col gap-2 text-[13px] font-medium text-ink-2">Password attuale <input class="h-10 w-full rounded-[9px] border border-line-strong bg-surface px-3 text-sm" type="password" name="current" autocomplete="current-password" [(ngModel)]="currentPassword" /></label>
    <label class="flex flex-col gap-2 text-[13px] font-medium text-ink-2">Nuova password <input class="h-10 w-full rounded-[9px] border border-line-strong bg-surface px-3 text-sm placeholder:text-placeholder" type="password" name="new" placeholder="Almeno 6 caratteri" autocomplete="new-password" [(ngModel)]="newPassword" /></label>
    <label class="flex flex-col gap-2 text-[13px] font-medium text-ink-2">Ripeti la nuova password <input class="h-10 w-full rounded-[9px] border border-line-strong bg-surface px-3 text-sm" type="password" name="confirm" autocomplete="new-password" [(ngModel)]="confirmPassword" /></label>
    <div class="flex justify-end gap-2.5">
      <button type="button" class="inline-flex h-10 items-center justify-center rounded-[9px] border border-line-strong bg-surface px-3.5 text-sm font-medium text-ink hover:bg-sunken" (click)="onCancel()" [disabled]="isBusy">{{ isForced ? 'Esci' : 'Annulla' }}</button>
      <button type="submit" class="inline-flex h-10 items-center justify-center rounded-[9px] bg-accent px-4 text-sm font-medium text-white shadow-sm hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-60" [disabled]="isBusy">{{ isBusy ? 'Salvataggio…' : 'Cambia password' }}</button>
    </div>
  </form>
</div>
